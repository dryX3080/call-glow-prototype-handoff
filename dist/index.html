<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efede8"><title>Звонок · живой свет</title><meta name="description" content="Интерактивный прототип звонка: живой свет, мягкая реакция на голос и видеосостояния."><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="refinements.css"><link rel="preload" href="assets/fonts/gerbera-medium.otf" as="font" type="font/otf" crossorigin><link rel="preload" href="assets/fonts/gerbera-bold.otf" as="font" type="font/otf" crossorigin></head>
<body>
<header class="lab-header"><a class="brand" href="#">Звонок <span>живой свет</span></a><div class="lab-actions"><button id="repeat">Повторить</button><button id="demo" aria-pressed="false">Демо голоса</button><button id="panel-toggle" aria-expanded="false" aria-controls="settings">Настройки</button></div></header>
<main class="workspace"><section class="preview" aria-label="Интерактивный экран звонка"><div class="phone" id="phone"><div class="art" id="art" data-node-id="3522:1719">
<div class="remote-video" id="remote-video"><img id="peer-photo" alt="Демоучастник звонка" src="assets/camera-remote-both.png"></div><button class="video-tap" id="video-tap" aria-label="Скрыть управление видео" hidden></button><div class="video-shadows" id="video-shadows" hidden><i></i><i></i></div><div class="self-preview" id="self-preview"><img id="local-photo" alt="Ваше демовидео" src="assets/camera-local-3522-1833.png"></div>
<div class="status-area" aria-hidden="true"><div class="status-time">9:41</div><div class="island"><img id="island" alt=""></div><div class="connectivity"><img id="signal" alt=""><img id="wifi" alt=""><img id="battery" alt=""></div></div>
<nav class="call-header" id="call-header" aria-label="Звонок"><button id="back" aria-label="Завершить и выйти"><img id="back-icon" alt=""></button><div class="call-title"><h1>Звонок</h1><div class="timer-pill"><img id="recording" alt=""><time id="timer" aria-label="Продолжительность звонка">00:00</time></div></div><span class="header-spacer"></span></nav>
<div class="notice" id="notice" role="status" aria-live="polite"><span id="notice-label">Подготовка...</span><img id="notice-visual" alt="" aria-hidden="true" hidden></div><div class="preparing-dots" id="preparing-dots" role="img" aria-label="Подготовка соединения"><img class="loading-ring" src="assets/preparation-ring.png" alt=""><img class="loading-ring" src="assets/preparation-ring.png" alt=""><img class="loading-ring" src="assets/preparation-ring.png" alt=""></div><p class="call-hint" id="call-hint" hidden></p>
<div class="controls" id="controls">
<div class="control"><button class="circle" id="speaker" aria-label="Выключить динамик" aria-pressed="true"><img id="speaker-icon" alt=""></button><span id="speaker-label">Динамик</span></div>
<div class="control"><button class="circle" id="camera" aria-label="Включить своё демовидео" aria-pressed="false"><img id="camera-icon" alt=""></button><span>Видео</span></div>
<div class="control mic-control"><div class="mic-halo" id="mic-halo" aria-hidden="true"><img class="glow-complete" id="glow-complete" src="assets/glow-complete.png" alt=""><i class="voice-ring ring-one"></i><i class="voice-ring ring-two"></i></div><button class="circle" id="microphone" aria-label="Включить свой микрофон" aria-pressed="false"><img id="mic-icon" alt=""></button><span>Микрофон</span></div>
<div class="control"><button class="circle end" id="end" aria-label="Завершить звонок"><img id="end-icon" alt=""></button><span>Завершить</span></div></div>
</div></div><div class="preview-caption"><span id="flow-status">Подготовка соединения</span><span class="live-dot"></span><span id="voice-status">Микрофон выключен</span></div></section>
<aside class="panel" id="settings" hidden aria-label="Настройки прототипа"><div class="panel-heading"><h2>Настройки</h2><button id="close-panel" aria-label="Скрыть настройки">×</button></div>
<label class="field">Сцена Figma<select id="scene"><option value="flow">Живой сценарий</option><option value="preparing">Подготовка</option><option value="connected">Подключились</option><option value="active">Активный звонок</option><option value="muted">Свой микрофон выключен</option><option value="own-video">Моя камера</option><option value="both-video">Обе камеры</option><option value="peer-video">Камера собеседника</option><option value="full-video">Видео без управления</option><option value="ended">Завершение</option></select></label>
<div class="peer-settings"><h3>Демоучастник</h3><label class="toggle">Микрофон собеседника<input id="peer-mic" type="checkbox"></label><label class="toggle">Камера собеседника<input id="peer-camera" type="checkbox"></label></div>
<div class="effect-settings"><label class="field">Палитра<select id="palette"><option value="auto">По состоянию звонка</option><option value="gold">Золотой</option><option value="lavender">Лаванда</option><option value="grey">Дымка</option><option value="cyan">Лазурь</option></select></label><div class="colors"><label>Цвет 1<input type="color" id="color-a" value="#fdab1b"></label><label>Цвет 2<input type="color" id="color-b" value="#fdab1b"></label></div>
<div class="sliders"><label for="speed">Скорость <output id="speed-value"></output></label><input id="speed" type="range" min="0" max="2" step=".05"><label for="flow">Сила переливания <output id="flow-value"></output></label><input id="flow" type="range" min="0" max="1" step=".01"><label for="intensity">Интенсивность света <output id="intensity-value"></output></label><input id="intensity" type="range" min="0" max=".65" step=".01"><label for="distortion">Искажение лучей <output id="distortion-value"></output></label><input id="distortion" type="range" min="0" max="1" step=".01"><label for="response">Выразительность реакции <output id="response-value"></output></label><input id="response" type="range" min="0" max="1.5" step=".01"><label for="sensitivity">Чувствительность к голосу <output id="sensitivity-value"></output></label><input id="sensitivity" type="range" min=".25" max="6" step=".05"></div>
<label class="toggle">Лучи реагируют на голос<input id="rays-voice" type="checkbox" checked></label><label class="toggle">Градиент реагирует на голос<input id="gradient-voice" type="checkbox" checked></label><label class="field demo-field">Режим демо<select id="demo-level"><option value="quiet">Тихая речь</option><option value="normal" selected>Обычная речь</option><option value="loud">Громкая речь</option><option value="silence">Тишина</option><option value="noise">Тихий шум</option><option value="clicks">Короткие щелчки</option></select></label><div class="meter" role="meter" aria-label="Реакция на голос" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="level-fill"></i></div><div class="panel-actions"><button id="pause" aria-pressed="false">Пауза</button><button id="reset">Сброс эффектов</button></div><p class="privacy">Звук обрабатывается на устройстве. Без записи и отправки. Камеры используют демофотографии.</p><p id="render-status" class="render-status">Загружаем свет…</p></div></aside>
</main><div class="toast" id="feedback" role="status" aria-live="polite" hidden></div><script type="module" src="app.js"></script></body></html>
